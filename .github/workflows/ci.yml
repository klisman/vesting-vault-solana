name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLANA_VERSION: "3.1.10"
  ANCHOR_VERSION: "1.1.2"

jobs:
  program:
    name: program
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Cache Solana CLI
        uses: actions/cache@v4
        id: cache-solana
        with:
          path: ~/.local/share/solana/install
          key: solana-${{ env.SOLANA_VERSION }}-${{ runner.os }}

      - name: Install Solana CLI
        if: steps.cache-solana.outputs.cache-hit != 'true'
        run: sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"

      - name: Add Solana CLI to PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        run: |
          mkdir -p "${HOME}/.local/bin"
          curl -sSL "https://github.com/solana-foundation/anchor/releases/download/v${ANCHOR_VERSION}/anchor-${ANCHOR_VERSION}-x86_64-unknown-linux-gnu" \
            -o "${HOME}/.local/bin/anchor"
          chmod +x "${HOME}/.local/bin/anchor"
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Build
        run: NO_DNA=1 anchor build --ignore-keys

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: NO_DNA=1 cargo test

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.10"
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Integration tests
        run: npm run test:integration
